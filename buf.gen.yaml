version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: agynio/api/apps/v1/apps.proto
      value: github.com/agynio/reminders/gen/agynio/api/apps/v1;appsv1
    - file_option: go_package
      path: agynio/api/gateway/v1/apps.proto
      value: github.com/agynio/reminders/gen/agynio/api/gateway/v1;gatewayv1
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
inputs:
  - module: buf.build/agynio/api
    paths:
      - agynio/api/apps/v1/apps.proto
      - agynio/api/gateway/v1/apps.proto
